<script>
  export default async (props, ctx) => {
    const $f7 = ctx.$f7,
      $f7route = ctx.$f7route,
      $onUnmounted = ctx.$onUnmounted,
      $on = ctx.$on;

    let vueApp = null;
    const { guid, subdevice } = $f7route.query;

    $on('pageMounted', (e, page) => {
      vueApp = new Vue({
        el: page.el.querySelector('#vue-app'),
        data: {
          btConnected: false,
          wifiConnected: false,
          isOn: false,
          targetHumidity: 50,
          targetTemp: 25,
          mode: 0, 
          modeList: [
            { name: 'Dehumidify', icon: 'invert_colors_off' },
            { name: 'Ventilation', icon: 'air' }
          ],
          windSpeed: 1,
          swingEnabled: false,
          timerOn: 0,
          timerOff: 0,
          baudRate: 0, 
          baudRateList: ['1200', '2400', '4800', '9600'],
          forcedStatus: 0,
          timerOnEnd: null, // Timestamp when Timer ON triggers
          timerOffEnd: null, // Timestamp when Timer OFF triggers
          forcedStatusList: [
            { id: 0, name: 'Auto Status', icon: 'sync_alt' },
            { id: 1, name: 'Forced Dehumid', icon: 'air_purifier' },
            { id: 2, name: 'Forced Humid', icon: 'opacity' },
            { id: 3, name: 'Forced Vent', icon: 'toys' }
          ],
          protocolType: 'default', // 'default' or 'new'
          protocolConfigs: {
            'default': {
              registers: { power: 0x1001, humidity: 0x1004, mode: 0x101c, wind: 0x1002, temp: 0x101b, swing: 0x000D, timerOn: 0x0010, timerOff: 0x0011, forced: 0x0012, baud: 0x000E },
              mapping: {
                power: (isOn) => isOn ? 0x0001 : 0x0000,
                humidity: (v) => v,
                mode: (idx) => [0, 6][idx],
                wind: (v) => v,
                temp: (v) => v,
                swing: (v) => v ? 1 : 0,
                timer: (h, m) => (h << 8) | m,
                forced: (v) => v,
                baud: (v) => v
              },
              range: { humidity: [30, 80], temp: [16, 32] },
              features: { temp: true, timer: true, forced: true, swing: true, baud: true }
            },
            'new': {
              registers: { power: 0x00ee, humidity: 0x0001, mode: 0x000f, wind: 0x000b },
              mapping: {
                power: (isOn) => isOn ? 0x00aa : 0x0055,
                humidity: (v) => v,
                mode: (idx) => [2, 1][idx],
                wind: (v) => v
              },
              range: { humidity: [10, 95] },
              features: { temp: false, timer: false, forced: false, swing: false, baud: false }
            }
          }
        },
        computed: {
          currentModeInfo() {
            return this.modeList[this.mode];
          },
          currentConfig() {
            return this.protocolConfigs[this.protocolType];
          }
        },
        methods: {
          async init() {
            if (window.peripheral[guid]) {
              this.btConnected = window.peripheral[guid].prop.connected;
            }
            this.checkWifi();
            this.detectProtocol();
            await this.loadPresets();
            this.startTimerInterval();
          },
          detectProtocol() {
            try {
              const subdevices = erp?.info?.profile?.profile_subdevice || [];
              const currentSub = subdevices.find(item => item.name === subdevice);
              if (currentSub && currentSub.device_button_group === "Lift485_Dehumidifier_Dba") {
                this.protocolType = 'new';
              } else {
                this.protocolType = 'default';
              }
              console.log('Detected protocol type:', this.protocolType);
            } catch (e) {
              console.error('Detect protocol failed', e);
              this.protocolType = 'default';
            }
          },
          async savePresets() {
            try {
              const presets = {
                isOn: this.isOn,
                targetHumidity: this.targetHumidity,
                targetTemp: this.targetTemp,
                mode: this.mode,
                windSpeed: this.windSpeed,
                swingEnabled: this.swingEnabled,
                baudRate: this.baudRate,
                forcedStatus: this.forcedStatus,
                timerOnEnd: this.timerOnEnd,
                timerOffEnd: this.timerOffEnd
              };
              await db.set(`dehumidifier_presets_${guid}`, JSON.stringify(presets));
            } catch (e) {
              console.error('Save presets failed', e);
            }
          },
          async loadPresets() {
            try {
              let res = await db.get(`dehumidifier_presets_${guid}`);
              if (res) {
                const presets = JSON.parse(res);
                this.isOn = presets.isOn ?? false;
                this.targetHumidity = presets.targetHumidity ?? 50;
                this.targetTemp = presets.targetTemp ?? 25;
                this.mode = (presets.mode === 1 ? 1 : 0);
                this.windSpeed = Number(presets.windSpeed) || 1;
                this.swingEnabled = presets.swingEnabled ?? false;
                this.baudRate = presets.baudRate ?? 0;
                this.forcedStatus = presets.forcedStatus ?? 0;
                this.timerOnEnd = presets.timerOnEnd || null;
                this.timerOffEnd = presets.timerOffEnd || null;
                this.refreshTimers();
              }
            } catch (e) {
              console.error('Load presets failed', e);
            }
          },
          refreshTimers() {
            const now = Date.now();
            if (this.timerOnEnd) {
              const diff = Math.max(0, Math.floor((this.timerOnEnd - now) / 60000));
              this.timerOn = diff;
              if (diff === 0) this.timerOnEnd = null;
            }
            if (this.timerOffEnd) {
              const diff = Math.max(0, Math.floor((this.timerOffEnd - now) / 60000));
              this.timerOff = diff;
              if (diff === 0) this.timerOffEnd = null;
            }
          },
          startTimerInterval() {
            // Update remaining time display every minute
            this._timerInterval = setInterval(() => {
              this.refreshTimers();
            }, 60000);
          },
          cleanupWifiListener() {
            if (this._wifiTopic && this._wifiChangeHandler) {
              emitter.off(this._wifiTopic, this._wifiChangeHandler);
            }
            this._wifiTopic = null;
            this._wifiChangeHandler = null;
          },
          checkWifi() {
            this.cleanupWifiListener();
            const profileDevice = (erp?.info?.profile?.profile_device && cloneDeep(erp.info.profile.profile_device)) || [];
            const profileDeviceMap = profileDevice.find(item => item.device === guid);
            if (!profileDeviceMap) {
              this.wifiConnected = false;
              return;
            }
            const gateway = profileDeviceMap.gateway;
            if (!gateway) {
              this.wifiConnected = false;
              return;
            }
            const will_topic = `will/${md5(md5(gateway))}`;
            try { core_mqtt_subscribe(will_topic, 1, false); } catch (e) {}
            this._wifiTopic = will_topic;
            this._wifiChangeHandler = (data = {}) => {
              if (typeof data.message === 'string' && data.message.includes("Online")) {
                this.wifiConnected = true;
              } else if (typeof data.message === 'string' && data.message.includes("Offline")) {
                this.wifiConnected = false;
              }
            };
            emitter.on(this._wifiTopic, this._wifiChangeHandler);
          },
          toggleBt() { this.btConnected = !this.btConnected; },
          togglePower() { 
            const nextState = !this.isOn;
            this.sendCommand('power', nextState, nextState ? 'Power On' : 'Power Off').then(() => {
              this.isOn = nextState;
            });
          },
          adjustHumidity(val) {
            let newHumid = this.targetHumidity + val;
            const range = this.currentConfig.range.humidity;
            if (newHumid >= range[0] && newHumid <= range[1]) {
              this.sendCommand('humidity', newHumid, 'Humidity').then(() => {
                this.targetHumidity = newHumid;
              });
            }
          },
          adjustTemp(val) {
            if (!this.currentConfig.features.temp) return;
            let newTemp = this.targetTemp + val;
            const range = this.currentConfig.range.temp;
            if (newTemp >= range[0] && newTemp <= range[1]) {
              this.sendCommand('temp', newTemp, 'Temperature').then(() => {
                this.targetTemp = newTemp;
              });
            }
          },
          cycleMode() {
            const nextIdx = (this.mode + 1) % this.modeList.length;
            this.sendCommand('mode', nextIdx, 'Work Mode').then(() => {
              this.mode = nextIdx;
            });
          },
          cycleWind() {
            const cur = Number(this.windSpeed) || 1;
            const nextSpeed = cur >= 5 ? 1 : cur + 1;
            this.sendCommand('wind', nextSpeed, 'Wind Speed').then(() => {
              this.windSpeed = nextSpeed;
            });
          },
          toggleSwing() {
            if (!this.currentConfig.features.swing) return;
            const nextState = !this.swingEnabled;
            this.sendCommand('swing', nextState, 'Swing').then(() => {
              this.swingEnabled = nextState;
            });
          },
          setForcedStatus(status) {
            if (!this.currentConfig.features.forced) return;
            this.sendCommand('forced', status, 'Mode').then(() => {
              this.forcedStatus = status;
            });
          },
          setBaudRate(rateIdx) {
            if (!this.currentConfig.features.baud) return;
            this.sendCommand('baud', rateIdx, 'Baud Rate').then(() => {
              this.baudRate = rateIdx;
            });
          },
          formatTimer(mins) {
            if (mins === 0) return '--';
            const h = Math.floor(mins / 60);
            const m = mins % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
          },
          cycleTimerOn() {
            if (!this.currentConfig.features.timer) return;
            let nextMins = this.timerOn + 30;
            if (nextMins > 1440) nextMins = 0;
            
            const h = Math.floor(nextMins / 60);
            const m = nextMins % 60;
            const val = this.currentConfig.mapping.timer(h, m);
            
            this.sendCommand('timerOn', val, 'Timer ON').then(() => {
              this.timerOn = nextMins;
              this.timerOnEnd = nextMins > 0 ? Date.now() + (nextMins * 60000) : null;
            });
          },
          cycleTimerOff() {
            if (!this.currentConfig.features.timer) return;
            let nextMins = this.timerOff + 30;
            if (nextMins > 1440) nextMins = 0;

            const h = Math.floor(nextMins / 60);
            const m = nextMins % 60;
            const val = this.currentConfig.mapping.timer(h, m);

            this.sendCommand('timerOff', val, 'Timer OFF').then(() => {
              this.timerOff = nextMins;
              this.timerOffEnd = nextMins > 0 ? Date.now() + (nextMins * 60000) : null;
            });
          },
          resetTimerOn() {
            if (!this.currentConfig.features.timer) return;
            this.sendCommand('timerOn', 0, 'Cancel Timer ON').then(() => {
              this.timerOn = 0;
              this.timerOnEnd = null;
            });
          },
          resetTimerOff() {
            if (!this.currentConfig.features.timer) return;
            this.sendCommand('timerOff', 0, 'Cancel Timer OFF').then(() => {
              this.timerOff = 0;
              this.timerOffEnd = null;
            });
          },
          // CRC16 Implementation
          modbusCRC16(data) {
            let crc = 0xFFFF;
            for (let i = 0; i < data.length; i++) {
              crc ^= data[i];
              for (let j = 0; j < 8; j++) {
                if (crc & 0x0001) {
                  crc >>= 1;
                  crc ^= 0xA001;
                } else {
                  crc >>= 1;
                }
              }
            }
            return {
              low: crc & 0xFF,
              high: (crc >> 8) & 0xFF
            };
          },
          // Build Frame
          buildFrame(action, val) {
            const config = this.currentConfig;
            const reg = config.registers[action];
            if (reg === undefined) return null;

            let finalVal = val;
            if (config.mapping[action]) {
              finalVal = config.mapping[action](val);
            }

            const deviceAddr = 0x01;
            const funcCode = 0x06;
            const frame = [
              deviceAddr,
              funcCode,
              (reg >> 8) & 0xFF,
              reg & 0xFF,
              (finalVal >> 8) & 0xFF,
              finalVal & 0xFF
            ];
            const crc = this.modbusCRC16(frame);
            const fullFrame = [...frame, crc.low, crc.high];
            return fullFrame.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
          },
          // Send Command
          async sendCommand(action, val, label) {
            const frameStr = this.buildFrame(action, val);
            if (!frameStr) {
              console.warn(`Action ${action} not supported in current protocol`);
              return;
            }
            const hexNoSpace = frameStr.replace(/\s+/g, '').toLowerCase();
            
            try {
              // 整体发送指令，不进行分割
              await window.peripheral[guid].doHdmiCec([{
                gang: 1,
                command: `8602${hexNoSpace}`,
              }]);
              
              let control_source = await bleHelper.getControlSource(guid);
              window.upload_device_control_log(guid, 1, control_source, subdevice, {
                command_type: 'SET',
                device_type: 'DEHUMIDIFIER485',
                command: hexNoSpace,
                device_command: `${action}_${val}`,
                button_name: label,
              });

            } catch (error) {
              console.error('Command send failed:', error);
              if (error == 7200) {
                erp.script.iot_entry_class_password_verify(guid, label).then(() => {});
              } else {
                const errorMsg = (typeof erp !== 'undefined' && erp.get_log_description) 
                  ? _(erp.get_log_description(error)) 
                  : (error.message || error);
                $f7.dialog.alert(errorMsg);
              }
            }
          }
        },
        watch: {
          isOn() { this.savePresets(); },
          targetHumidity() { this.savePresets(); },
          targetTemp() { this.savePresets(); },
          mode() { this.savePresets(); },
          windSpeed() { this.savePresets(); },
          swingEnabled() { this.savePresets(); },
          baudRate() { this.savePresets(); },
          forcedStatus() { this.savePresets(); },
          timerOnEnd() { this.savePresets(); },
          timerOffEnd() { this.savePresets(); }
        },
        mounted() { this.init(); }
      });
    });

    $on('pageBeforeRemove', (e, page) => {
      if (vueApp && vueApp.cleanupWifiListener) vueApp.cleanupWifiListener();
    });

    $onUnmounted(() => {
      if (vueApp && vueApp._timerInterval) clearInterval(vueApp._timerInterval);
      if (vueApp && vueApp.cleanupWifiListener) vueApp.cleanupWifiListener();
      if (vueApp) vueApp.$destroy();
    });

    return $render;
  };
</script>
