<template>
  <div class="page">
    <div class="navbar active">
      <div class="navbar-bg"></div>
      <div class="navbar-inner sliding">
        <div class="left">
          <a href="#" class="button button-fill text-color-theme bg-color-white button-44 back">
            <i class="icon icon-back"></i>
            <span class="if-not-md">Back</span>
          </a>
        </div>
        <div class="title">{{ _('Radar Distance Limit') }}</div>
      </div>
    </div>

    <div class="page-content">
      {% raw %}
      <div id="vue-app" v-cloak>
        <div class="view view-main">
          <div class="card">
            <div class="card-content card-content-padding overflow-hidden">
              <div class="list">
                <ul>
                  <li class="item-content item-input no-padding-left">
                    <div class="item-inner no-padding-right">
                      <div class="item-title item-label" style="padding: 10px 15px">{{ _("Radar Distance Limit") }}
                        <div style="font-size: 12px; color: #999;">{{ _('(0% is the closest, 100% is the farthest.)') }}</div>
                      </div>
                      <div class="item-input-wrap pb-1">
                        <div class="display-flex flex-direction-row px-3">
                          <div
                            class="range-slider"
                            data-min="0"
                            data-max="100"
                            data-label="true"
                            data-step="1"
                            data-value="0"
                            data-scale="true"
                            data-scale-steps="5"
                            data-scale-sub-steps="5"
                            id="ir-cool-setpoint-limit-lower-slider"
                          >
                            <input type="range" name="setpoint_limit_lower" />
                          </div>
                        </div>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
            <div class="row" style="margin-bottom: 15px; margin-top: 15px">
              <div class="col">
                <div class="button button-fill button-save" v-on:click="save()">{{_("COMPLETE")}}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {% endraw %}
    </div>
  </div>
</template>

<script>
  export default async (props, ctx) => {
    const $f7 = ctx.$f7,
      $f7route = ctx.$f7route,
      $onUnmounted = ctx.$onUnmounted,
      $on = ctx.$on,
      $update = ctx.$update;

    let vueApp = null;
    const { guid, subdevice } = $f7route.query;
    const sortableAction = () => {
      // sortable = !sortable;
      // console.log(sortable);
      // $update();
      vueApp.$sortableAction();
    };
    const onPriceChange = (e) => {
      const range = app.range.get(e.target);
      console.log(range);
    };
    $on('pageMounted', (e, page) => {
      vueApp = new Vue({
        el: page.el.querySelector('#vue-app'),
        data: {
          rangeMap: {},
          volumeLimit: 0,
          volumeUpper: 50,
        },
        computed: {},
        watch: {},
        mounted() {
          this.initData();
        },
        methods: {
          async save() {
            //save in erp
            app.dialog.preloader();
            let percentage = this.rangeMap['radar-distance-limit'].getValue();
            // 将百分比转换回实际数值 (100% -> 50, 0% -> 500)
            this.volumeUpper = Math.round(500 - (percentage * 4.5));
            
            console.log('Percentage:', percentage, 'Actual Value:', this.volumeUpper);
            
            try {
              await iot_ble_check_enable();
              await window.peripheral[guid].write([
                {
                  service: 'ff80',
                  characteristic: 'ff81',
                  data: `9534000003${iot_utils_to_upper_endian_hex(parseInt(this.volumeUpper)*10000,3)}`,
                },
              ]);
              await iot_device_setting_sync_server(guid, 'radar_distance_limit', this.volumeUpper);
              app.dialog.close();
              app.dialog.alert(_('Save Successfully'));
            } catch (error) {
              app.dialog.close();
              app.dialog.alert(error);
            }
          },
          initData() {
            let devices = cloneDeep(erp.info.device);
            if (isset(devices[guid])) {
              let settings = devices[guid].settings;
              settings.forEach((item) => {
                if (item.setting_type == 'radar_distance_limit') {
                  this.volumeUpper = item.setting;
                }
              });
            }
            let key_1 = 'radar-distance-limit';
            setTimeout(() => {
              // 初始显示时，将实际数值转换为百分比
              let initialPercentage = Math.round((500 - this.volumeUpper) / 4.5);
              this.initRangeSlider(key_1, '#ir-cool-setpoint-limit-lower-slider', initialPercentage);
            }, 0);
          },
          initRangeSlider(key, el, initialValue) {
            if (!isset(this.rangeMap[key])) {
              this.rangeMap[key] = app.range.create({
                el: el,
                value: initialValue,
                min: 0,
                max: 100,
                step: 1,
                draggableBar: false,
                scale: true,
                label: true,
                scaleSteps: 5,
                scaleSubSteps: 5,
                formatScaleLabel: (v) => {
                  return v + '%';
                },
                formatLabel: (v) => {
                  return v + '%';
                },
                on: {
                  change: (range) => {
                    // console.log(range.getValue());
                  },
                },
              });
              if (this.rangeMap[key]) {
                this.rangeMap[key].setValue(initialValue);
              }
            }
          },
        },
      });
    });

    $on('pageBeforeRemove', (e, page) => {});

    $onUnmounted(() => {
      if (vueApp) {
        vueApp.$destroy();
      }
    });

    return $render;
  };
</script>

  .range-knob {
    width: 150%;
    height: 150%;

  .px-3 {
    margin: 30px 0 !important;

    transform: translateY(0%) scale(1) !important;
