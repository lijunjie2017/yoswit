                      //   applyCfg('writeTotalBlock', visionlineULWriteBlockConfig);

                        // >>>>>>>>> S50/S70 处理逻辑 (32位 + 跳过密码块) <<<<<<<<<
                        const BLOCK_SIZE = 32; // 16字节 = 32 Hex字符
                        let currentAddr = 4; // 从第1扇区第0块开始 (绝对地址4)

                        for (let i = 0; i < encryptedImage.length; i += BLOCK_SIZE) {
                          // 1. 检查当前地址是否为控制块 (3, 7, 11, 15...)
                          // 公式: (addr + 1) % 4 === 0
                          if ((currentAddr + 1) % 4 === 0) {

                            currentAddr++; // 跳过，指向下一扇区第0块
                          }

                          // 2. 截取数据
                          let chunk = encryptedImage.substring(i, i + BLOCK_SIZE);
                          // 补全 (防止最后一段不足32位)
                          if (chunk.length < BLOCK_SIZE) {
                            chunk = chunk.padEnd(BLOCK_SIZE, '0');
                          }

                          // 3. 加入列表
                          finalWriteList.push({
                            addr: currentAddr,
                            data: chunk,
                          });

                          currentAddr++;
                        }
                      } else {
                        // >>>>>>>>> UL 处理逻辑 (8位 + 线性写入) <<<<<<<<<
                        const chunks = encryptedImage.match(/.{1,8}/g) || [];
                        finalWriteList = chunks.map((chunk, index) => ({
                          addr: 4 + index, // UL卡从Page 4开始线性写
                          data: chunk,

                      app.dialog.alert(_('Success!'));

    function setSignature(method, MD5Header, xDateHader, dateHader, uri, accessKey) {
      // 构建要签名的字符串
      let string_to_sign = method + '\n';

      if (MD5Header) {
        string_to_sign += MD5Header;
      }
      string_to_sign += '\n';

      // 获取 contentType，如果没有明确提供，使用默认值
      let contentType = 'application/json;charset=UTF-8';
      string_to_sign += contentType;
      string_to_sign += '\n';

      if (xDateHader) {
        string_to_sign += '\n' + 'x-aah-date' + ':' + xDateHader;
      } else {
        string_to_sign += dateHader;
      }
      string_to_sign += '\n' + uri;

      // 生成 HMAC SHA1 签名
      const hash = CryptoJS.HmacSHA1(string_to_sign, accessKey);
      const hashInBase64 = CryptoJS.enc.Base64.stringify(hash);
      return hashInBase64;
    }
    async function postToServer(url, uri, dataObj, accessKey, sessionID, func) {
      app.preloader.show();
      const requestContentBase64String = CryptoJS.MD5(JSON.stringify(dataObj)).toString(CryptoJS.enc.Base64);
      const newTime = dayjs().subtract(8, 'hour');
      const this_date = newTime.format('ddd, DD MMM YYYY HH:mm:ss [GMT]');
      let signature = '';
      let headerData = {
        'Content-Type': 'application/json;charset=UTF-8',
        'Content-MD5': requestContentBase64String,
        'Date': this_date,
        'X-Aah-Date': this_date,
      };
      if (accessKey) {
        signature = setSignature('POST', requestContentBase64String, this_date, this_date, uri, accessKey);
        headerData['Authorization'] = `AWS ${sessionID}:${signature}`;
      }
      try {
        cordova.plugin.http.setServerTrustMode(
          'nocheck',
          () => {
            http
              .request(
                encodeURI(url + uri),
                {
                  method: 'POST',
                  serializer: 'utf8',
                  responseType: 'json',
                  headers: headerData,
                  debug: true,
                  data: JSON.stringify(dataObj),
                },
                () => {},
                (error) => {
                  console.err(error);
                }
              )
              .then((response) => {
                func(response);
              });
          },
          (error) => {
            // 处理 setServerTrustMode 方法本身可能出现的错误
            app.dialog.alert(error);
          }
        );
      } catch (err) {
        app.dialog.alert(err);
      } finally {
        app.preloader.hide();
      }
    }

    try {
      await Capacitor.Plugins.CardIssuer.removeAllListeners();

      await Capacitor.Plugins.CardIssuer.addListener('callback', (result) => {
        console.log(result);
        if(result.msg.includes('Card found at mouth') == false) {
            app.preloader.hide();
        }
        app.dialog.alert(result.msg);
      });
    } catch (err) {
      console.error(err);
    }

              // 智能截断长文本（显示开头和结尾）
              smartTruncate(text, maxLength) {
                if (!text) return '';
                const str = String(text);
                if (str.length <= maxLength) return str;
                
                // 显示前面部分和后面部分
                const frontChars = Math.floor(maxLength * 0.6);
                const backChars = Math.floor(maxLength * 0.3);
                return str.substring(0, frontChars) + '...' + str.substring(str.length - backChars);
              },
              
              // 截断长文本（保留用于其他地方）
              truncateText(text, maxLength) {
                if (!text) return '';
                const str = String(text);
                if (str.length <= maxLength) return str;
                return str.substring(0, maxLength) + '...';
              },

                          text: _('Cancel'),

                              self.updateFieldDirect(method, fieldKey, newValue);
                            } else if (isString) {
                              newValue = document.getElementById('view-edit-textarea').value;
                              self.updateFieldDirect(method, fieldKey, newValue);
                            } else {
                              newValue = document.getElementById('view-edit-textarea').value;
                              self.updateFieldJSON(method, fieldKey, newValue);
                            }
                            
                            app.toast.create({
                              text: _('Saved'),
                              closeTimeout: 1500,
                              position: 'center'
                            }).open();
                            currentDialog.close();
                            currentDialog = null;
                          }
                        }
                      ],
                      on: {
                        opened: () => {
                          if (isNumber) {
                            const input = document.getElementById('view-edit-number');
                            if (input) {
                              input.focus();
                              input.select();
                            }
                          } else if (!isBoolean) {
                            const textarea = document.getElementById('view-edit-textarea');
                            if (textarea) {
                              textarea.focus();
                              textarea.setSelectionRange(0, textarea.value.length);
                            }
                          }
                        }
                      }
                    });
                  } else {
                    // 查看模式
                    currentDialog = app.dialog.create({
                      title: fieldKey,
                      text: `<div style="max-height: 400px; overflow-y: auto; text-align: left; word-break: break-all; white-space: pre-wrap; font-family: monospace; font-size: 13px; background: #f5f5f5; padding: 12px; border-radius: 8px;">${displayValue}</div>`,
                      buttons: [
                        {
                          text: _('Copy'),
                          onClick: () => {
                            self.copyValue(value);
                          }
                        },
                        {
                          text: _('Edit'),
                          onClick: () => {
                            showDialog(true);
                          }
                        },
                        {
                          text: _('Close'),
                          bold: true
                        }
                      ]
                    });
                  }
                  
                  currentDialog.open();
                };
                
                showDialog(false);
              },
              
              // 复制值到剪贴板
              copyValue(value) {
                const textToCopy = typeof value === 'string' ? value : JSON.stringify(value);
                
                // 使用现代 Clipboard API
                if (navigator.clipboard && navigator.clipboard.writeText) {
                  navigator.clipboard.writeText(textToCopy).then(() => {
                    app.toast.create({
                      text: _('Copied To Clipboard'),
                      closeTimeout: 2000,
                      position: 'center'
                    }).open();
                  }).catch(err => {
                    console.error('Failed to copy:', err);
                    app.toast.create({
                      text: _('Copy failed'),
                      closeTimeout: 2000,
                      position: 'center'
                    }).open();
                  });
                } else {
                  // 降级方案
                  const textarea = document.createElement('textarea');
                  textarea.value = textToCopy;
                  textarea.style.position = 'fixed';
                  textarea.style.opacity = '0';
                  document.body.appendChild(textarea);
                  textarea.select();
                  try {
                    document.execCommand('copy');
                    app.toast.create({
                      text: _('Copied To Clipboard'),
                      closeTimeout: 2000,
                      position: 'center'
                    }).open();
                  } catch (err) {
                    console.error('Failed to copy:', err);
                  }
                  document.body.removeChild(textarea);
                }
              },
              
              // 全屏编辑字段
              editFieldFullscreen(method, fieldKey, currentValue) {
                const self = this;
                const isLongText = String(currentValue).length > 100;
                
                app.dialog.create({
                  title: fieldKey,
                  text: `<textarea id="fullscreen-editor" style="width: 100%; min-height: ${isLongText ? '300px' : '150px'}; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-family: monospace; font-size: 13px; resize: vertical;">${currentValue}</textarea>`,
                  buttons: [
                    {
                      text: _('Cancel')
                    },
                    {
                      text: _('Save'),
                      bold: true,
                      onClick: () => {
                        const newValue = document.getElementById('fullscreen-editor').value;
                        self.updateFieldDirect(method, fieldKey, newValue);
                        app.toast.create({
                          text: _('Saved'),
                          closeTimeout: 1500,
                          position: 'center'
                        }).open();
                      }
                    }
                  ],
                  on: {
                    opened: () => {
                      // 自动聚焦并选中全部文本
                      const editor = document.getElementById('fullscreen-editor');
                      if (editor) {
                        editor.focus();
                        editor.setSelectionRange(0, editor.value.length);
                      }
                    }
                  }
                }).open();
              },
              
              // 全屏编辑 JSON
              editJSONFullscreen(method, fieldKey, currentValue) {
                const self = this;
                const jsonString = JSON.stringify(currentValue, null, 2);
                
                app.dialog.create({
                  title: fieldKey + ' (JSON)',
                  text: `<textarea id="fullscreen-json-editor" style="width: 100%; min-height: 300px; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-family: monospace; font-size: 13px; resize: vertical;">${jsonString}</textarea>`,
                  buttons: [
                    {
                      text: _('Cancel')
                    },
                    {
                      text: _('Save'),
                      bold: true,
                      onClick: () => {
                        const newValue = document.getElementById('fullscreen-json-editor').value;
                        self.updateFieldJSON(method, fieldKey, newValue);
                        app.toast.create({
                          text: _('Saved'),
                          closeTimeout: 1500,
                          position: 'center'
                        }).open();
                      }
                    }
                  ],
                  on: {
                    opened: () => {
                      // 自动聚焦
                      const editor = document.getElementById('fullscreen-json-editor');
                      if (editor) {
                        editor.focus();
                      }
                    }
                  }
                }).open();
              },
              
              // 判断某方法是否处于编辑模式
              isMethodEdit(method) {
                return !!this.editingMethods[method];
              },

              // 切换某方法的编辑模式
              // 显示方法操作菜单
              showMethodMenu(method) {
                const self = this;
                
                const buttons = [
                  {
                    text: _('Add Field'),
                    icon: '<i class="f7-icons">plus</i>',
                    onClick: () => {
                      self.showAddFieldDialog(method);
                    }
                  },
                  {
                    text: _('Delete Method'),
                    icon: '<i class="f7-icons">trash</i>',
                    color: 'red',
                    onClick: () => {
                      self.deleteMethod(method);
                    }
                  }
                ];
                
                const actions = app.actions.create({
                  buttons: [
                    buttons,
                    [
                      {
                        text: _('Cancel'),
                        bold: true
                      }
                    ]
                  ]
                });
                
                actions.open();
              },
              
              toggleMethodEdit(method) {
                const current = !!this.editingMethods[method];
                this.$set(this.editingMethods, method, !current);
                // 退出方法编辑时，清理正在编辑的名称状态，避免错位
                if (!this.editingMethods[method]) {
                  if (this.editingMethodName === method) {
                    this.editingMethodName = '';
                    this.editingMethodValue = '';
                  }
                  if (this.editingFieldKey && this.editingFieldKey.startsWith(method + '_')) {
                    this.editingFieldKey = '';
                    this.editingFieldName = '';
                  }
                }
              },

              // 检查是否正在编辑该字段
              isEditingField(method, fieldKey) {
                return this.editingFieldKey === method + '_' + fieldKey;
              },
              
              // 处理方法名点击
              handleMethodNameClick(method) {
                if (this.isMethodEdit(method)) {
                  this.startEditMethodName(method);
                }
              },
              
              // 处理字段名点击
              handleFieldNameClick(method, fieldKey) {
                if (this.isMethodEdit(method)) {
                  this.startEditFieldName(method, fieldKey);
                }
              },
              
              // 开始编辑方法名
              startEditMethodName(methodName) {
                this.editingMethodName = methodName;
                this.editingMethodValue = methodName;
                this.$nextTick(() => {
                  const input = this.$el.querySelector('.block-title input');
                  if (input) input.focus();
                });
              },
              
              // 完成编辑方法名
              finishEditMethodName(oldMethodName) {
                const newMethodName = this.editingMethodValue.trim();
                if (!newMethodName) {
                  app.toast.create({ text: _('Method name cannot be empty'), closeTimeout: 2000 }).open();
                  this.editingMethodName = '';
                  return;
                }
                
                if (newMethodName !== oldMethodName) {
                  if (this.configData[newMethodName]) {
                    app.toast.create({ text: _('Method Already Exists'), closeTimeout: 2000 }).open();
                    this.editingMethodName = '';
                    return;
                  }
                  
                  // 重命名方法
                  const methodData = this.configData[oldMethodName];
                  this.$set(this.configData, newMethodName, methodData);
                  this.$delete(this.configData, oldMethodName);
                  this.methods = Object.keys(this.configData);
                }
                
                this.editingMethodName = '';
                this.editingMethodValue = '';
              },
              
              // 开始编辑字段名
              startEditFieldName(methodName, fieldKey) {
                this.editingFieldKey = methodName + '_' + fieldKey;
                this.editingFieldName = fieldKey;
                this.$nextTick(() => {
                  const input = this.$el.querySelector('.field-name-cell input');
                  if (input) input.focus();
                });
              },
              
              // 完成编辑字段名
              finishEditFieldName(methodName, oldFieldKey) {
                const newFieldKey = this.editingFieldName.trim();
                if (!newFieldKey) {
                  app.toast.create({ text: _('Field name cannot be empty'), closeTimeout: 2000 }).open();
                  this.editingFieldKey = '';
                  return;
                }
                
                if (newFieldKey !== oldFieldKey) {
                  if (this.configData[methodName].hasOwnProperty(newFieldKey)) {
                    app.toast.create({ text: _('Field Already Exists'), closeTimeout: 2000 }).open();
                    this.editingFieldKey = '';
                    return;
                  }
                  
                  // 重命名字段
                  const fieldValue = this.configData[methodName][oldFieldKey];
                  this.$set(this.configData[methodName], newFieldKey, fieldValue);
                  this.$delete(this.configData[methodName], oldFieldKey);
                }
                
                this.editingFieldKey = '';
                this.editingFieldName = '';
              }, 
              
              getFieldType(value) {
                if (Array.isArray(value)) return _('Array');
                if (value === null) return _('Null');
                const type = typeof value;
                const typeMap = {
                  'string': _('String'),
                  'number': _('Number'),
                  'boolean': _('Boolean'),
                  'object': _('Object')
                };
                return typeMap[type] || type;
              },
              
              showAddMethodDialog() {
                const self = this;
                app.dialog.prompt(_('Please enter method name'), _('Add New Method'), function(methodName) {
                  if (!methodName || !methodName.trim()) {
                    app.toast.create({ text: _('Method name cannot be empty'), closeTimeout: 2000 }).open();
                    return;
                  }
                  
                  if (self.configData[methodName]) {
                    app.toast.create({ text: _('Method Already Exists'), closeTimeout: 2000 }).open();
                    return;
                  }
                  
                  self.$set(self.configData, methodName, {});
                  self.methods = Object.keys(self.configData);
                  
                  app.toast.create({ text: _('Method Added Successfully'), closeTimeout: 2000 }).open();
                });
              },
              
              deleteMethod(methodName) {
                const self = this;
                app.dialog.confirm(
                  _('Are you sure to delete method "' + methodName + '"?'),
                  _('Delete Confirmation'),
                  function() {
                    self.$delete(self.configData, methodName);
                    self.methods = Object.keys(self.configData);
                    
                    app.toast.create({ text: _('Method Deleted'), closeTimeout: 2000 }).open();
                  }
                );
              },
              
              showAddFieldDialog(methodName) {
                const self = this;
                self.addFieldTargetMethod = methodName;
                
                app.dialog.create({
                  title: _('Add Field to') + ' ' + methodName,
                  content: '<div class="list no-hairlines"><ul>' +
                    '<li class="item-content item-input"><div class="item-inner"><div class="item-title item-label">' + _('Field Name') + '</div><div class="item-input-wrap"><input type="text" id="field-name-input" placeholder="' + _('e.g: quality') + '"></div></div></li>' +
                    '<li class="item-content item-input"><div class="item-inner"><div class="item-title item-label">' + _('Type') + '</div><div class="item-input-wrap"><select id="field-type-select">' +
                    '<option value="string">' + _('String') + '</option>' +
                    '<option value="number">' + _('Number') + '</option>' +
                    '<option value="boolean">' + _('Boolean') + '</option>' +
                    '<option value="array">' + _('Array') + '</option>' +
                    '<option value="object">' + _('Object') + '</option>' +
                    '</select></div></div></li>' +
                    '</ul></div>',
                  buttons: [
                    { text: _('Cancel') },
                    { 
                      text: _('Add'),
                      bold: true,
                      onClick: function() {
                        const fieldName = document.getElementById('field-name-input').value;
                        const fieldType = document.getElementById('field-type-select').value;
                        
                        if (!fieldName || !fieldName.trim()) {
                          app.toast.create({ text: _('Please enter field name'), closeTimeout: 2000 }).open();
                          return false;
                        }
                        
                        if (self.configData[self.addFieldTargetMethod].hasOwnProperty(fieldName)) {
                          app.toast.create({ text: _('Field Already Exists'), closeTimeout: 2000 }).open();
                          return false;
                        }

                        let defaultValue;
                        switch (fieldType) {
                          case 'string': defaultValue = ''; break;
                          case 'number': defaultValue = 0; break;
                          case 'boolean': defaultValue = false; break;
                          case 'array': defaultValue = []; break;
                          case 'object': defaultValue = {}; break;
                          default: defaultValue = '';
                        }

                        self.updateFieldDirect(self.addFieldTargetMethod, fieldName, defaultValue);
                        app.toast.create({ text: _('Field Added Successfully'), closeTimeout: 2000 }).open();
                      }
                    }
                  ]
                }).open();
              },
              
              updateFieldDirect(methodName, fieldKey, value) {
                if (!this.configData[methodName]) {
                  this.$set(this.configData, methodName, {});
                }
                this.$set(this.configData[methodName], fieldKey, value);
              },
              
              updateFieldJSON(methodName, fieldKey, jsonString) {
                try {
                  const value = JSON.parse(jsonString);
                  this.updateFieldDirect(methodName, fieldKey, value);
                } catch (err) {
                  // 用户可能正在输入
                }
              },
              
              deleteFieldDirect(methodName, fieldKey) {
                const self = this;
                app.dialog.confirm(
                  _('Are you sure to delete field "' + fieldKey + '"?'),
                  _('Delete Confirmation'),
                  function() {
                    self.$delete(self.configData[methodName], fieldKey);
                    app.toast.create({ text: _('Field Deleted'), closeTimeout: 2000 }).open();
                  }
                );
              },
              
              resetConfig() {
                const self = this;
                app.dialog.confirm(
                  _('Are you sure to reset all configurations to default?'),
                  _('Reset Confirmation'),
                  function() {
                    self.configData = JSON.parse(JSON.stringify(defaultJSONConfig));
                    self.methods = Object.keys(self.configData);
                    app.toast.create({ text: _('Reset To Default Configuration'), closeTimeout: 2000 }).open();
                  }
                );
              },
              
              format() {
                try {
                  const json = JSON.parse(this.value);
                  this.$emit('input', JSON.stringify(json, null, 2));
                  app.toast.create({ text: _('Formatted Successfully'), closeTimeout: 2000 }).open();
                } catch (err) {
                  app.toast.create({ text: _('Format failed: ') + err.message, closeTimeout: 2000 }).open();
                }
              },
              
              // 保存并重新加载配置
              async saveAndLoad() {
                try {
                  // 先保存
                  console.log('save', this.value);
                  await db.set($f7route.path, this.value);
                  
                  // 再加载
                  const json = await db.get($f7route.path);
                  if (json) {
                    this.$emit('input', json);
                    app.toast.create({ 
                      text: _('Saved And Reloaded Successfully'), 
                      closeTimeout: 2000,
                      position: 'center'
                    }).open();
                  }
                } catch (err) {
                  app.toast.create({ 
                    text: _('Operation failed: ') + err.message, 
                    closeTimeout: 2000,
                    position: 'center'
                  }).open();
                }
              },
              
              async save() {
                try {
                  console.log('save', this.value);
                  await db.set($f7route.path, this.value);
                  app.toast.create({ text: _('Saved Successfully'), closeTimeout: 2000 }).open();
                } catch (err) {
                  app.toast.create({ text: _('Save failed: ') + err.message, closeTimeout: 2000 }).open();
                }
              },
              
              async load() {
                try {
                  const json = await db.get($f7route.path);
                  if (json) {
                  this.$emit('input', json);
                    app.toast.create({ text: _('Loaded Successfully'), closeTimeout: 2000 }).open();
                  } else {
                    app.toast.create({ text: _('No Saved Configuration'), closeTimeout: 2000 }).open();
                  }
                } catch (err) {
                  app.toast.create({ text: _('Load failed: ') + err.message, closeTimeout: 2000 }).open();
                }
              },
              
              copyJSON() {
                try {
                  if (navigator.clipboard) {
                    navigator.clipboard.writeText(this.formattedJSON);
                    app.toast.create({ text: _('Copied To Clipboard'), closeTimeout: 2000 }).open();
                  } else {
                    app.toast.create({ text: _('Browser Does Not Support Copy'), closeTimeout: 2000 }).open();
                  }
                } catch (err) {
                  app.toast.create({ text: _('Copy failed'), closeTimeout: 2000 }).open();
                }
              }
            },
            mounted() {
              // 初始化时如果没有配置，提示用户
              if (Object.keys(this.configData).length === 0 && this.viewMode === 'form') {
                setTimeout(() => {
                  app.toast.create({ 
                    text: _('Configuration is empty, please click "Add Method" to start'), 
                    closeTimeout: 3000 
                  }).open();
                }, 500);
              }
              
              // 初始化Smart Select
              this.$nextTick(() => {
                const smartSelects = this.$el.querySelectorAll('.smart-select-init');
                smartSelects.forEach(el => {
                  if (!el.f7SmartSelect) {
                    app.smartSelect.create({
                      el: el,
                      openIn: 'popup',
                      closeOnSelect: true
                    });
                  }
                });
              });
            },
            updated() {
              // 更新时重新初始化Smart Select
              this.$nextTick(() => {
                const smartSelects = this.$el.querySelectorAll('.smart-select-init');
                smartSelects.forEach(el => {
                  if (!el.f7SmartSelect) {
                    app.smartSelect.create({
                      el: el,
                      openIn: 'popup',
                      closeOnSelect: true
                    });
                  }
                });
              });
            }
          },
          '$ui.action.$vnode': {
            template: `
            <div id="tab-actions" class="tab" style="width: 100%; padding: 8px; box-sizing: border-box;">
              <div class="block-title" style="margin: 8px 8px 12px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #8e8e93;">{{ _('Plugin Methods') }}</div>
              
              <div v-if="actions.length === 0" class="block text-align-center text-color-gray">
                <p>{{ _('No Actions Available') }}</p>
              </div>
              
              <!-- 极简卡片设计 -->
              <div class="action-grid-simple" v-else>
                <div 
                  class="action-card-simple" 
                  v-for="action in actions" 
                  :key="action.method"
                  :class="{ 'is-executing': executing === action.method }"
                  @click="callMethod(action)"
                  :disabled="executing === action.method"
                >
                  <button 
                    v-if="action.description"
                    class="action-info-badge"
                    @click.stop="showDescription(action)"
                  >
                    <i class="f7-icons">info_circle</i>
                  </button>
                  
                  <div class="action-card-icon">
                    <i class="f7-icons" v-if="executing === action.method">arrow_2_circlepath</i>
                    <i class="f7-icons" v-else>play_fill</i>
                  </div>
                  
                  <div class="action-card-name">{{ action.method }}</div>
                </div>
              </div>
              
              <div v-if="results.length > 0" style="margin-top: 24px;">
                <div class="block-title" style="display: flex; justify-content: space-between; align-items: center; margin: 0 8px 10px; padding-right: 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #8e8e93;">
                  <span>{{ _('Execution Results') }}</span>
                  <button class="clear-results-btn" @click.prevent="clearResults" :title="_('Clear')">
                    <i class="f7-icons">trash</i>
                  </button>
                </div>
                
                <div class="card" v-for="(result, index) in results" :key="index" style="margin: 8px; border-radius: 12px; overflow: hidden;">
                  <div class="card-header" :class="result.success ? 'text-color-green' : 'text-color-red'">
                    <i class="f7-icons" style="margin-right: 4px;">{{ result.success ? 'checkmark_circle' : 'xmark_circle' }}</i>
                    {{ result.method }}
                    <span style="margin-left: auto; font-size: 12px; opacity: 0.7;">{{ result.time }}</span>
                  </div>
                  <div class="card-content card-content-padding">
                    <div v-if="result.success">
                      <small class="text-color-gray">{{ _('Duration') }}: {{ result.duration }}ms</small>
                    </div>
                    <div v-else style="color: #ff3b30; font-size: 13px; word-break: break-word;">
                      {{ result.error }}
                    </div>
                  </div>
                </div>
              </div>
            </div>
            `,
            inject: ['getFrappe'],
            data() {
              return {
                actions: pluginActions,
                results: [],
                executing: null,
              };
            },
            methods: {
              showDescription(action) {
                app.dialog.alert(action.description || _('No description'), action.method);
              },
              
              async callMethod(act) {
                const clickFn = act.onClick;
                if (typeof clickFn !== 'function') {
                  app.dialog.alert(_('Method not implemented'));
                  return;
                }
                
                this.executing = act.method;
                const config = this.getFrappe().web_form.get_value('config');
                
                try {
                  const configObj = JSON.parse(config);
                  
                  const applyCfg = (key, newCfg) => {
                    // merge
                    configObj[key] = window.lodash.merge(configObj[key] || {}, newCfg || {});
                    this.getFrappe().web_form.set_value('config', JSON.stringify(configObj, null, 2));
                  };
                  
                  const startTime = Date.now();
                  await clickFn(configObj[act.method] || defaultJSONConfig[act.method] || {}, configObj, applyCfg);
                  const duration = Date.now() - startTime;
                  
                  this.results.unshift({
                    method: act.method,
                    time: new Date().toLocaleTimeString(),
                    duration: duration,
                    success: true,
                  });
                  
                  app.toast.create({ text: _('Execution successful'), closeTimeout: 1500 }).open();
                } catch (err) {
                  console.error(err);
                  this.results.unshift({
                    method: act.method,
                    time: new Date().toLocaleTimeString(),
                    error: err.message || String(err),
                    success: false,
                  });
                  app.dialog.alert(_('Execution failed') + ': ' + (err.message || err));
                } finally {
                  this.executing = null;
                }
              },
              clearResults() {
                this.results = [];
              },
            },
          },
        }
      );

      try {
        await init();
      } catch (err) {
        console.error(err);
      }
    });

    ctx.$onUnmounted(async () => {
      globalVueApp && globalVueApp.$destroy();

      try {
        await deinit();
      } catch (err) {
        console.error(err);
      }
    });

    return $render;
  };
</script>
