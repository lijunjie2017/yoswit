        create_ticket &&
        findAccessType(access_type, 'QR Code') &&
        !findAccessType(access_type, 'Dynamic QR Code') &&
        findAccessType(access_type, 'Door Management')
      ) {
        showQrCode1.value = true;
        showQrCode2.value = true;
        showQrCode3.value = false;
        showQrCode4.value = false;
        showQrCode5.value = true;
      }
      // 10
      if (
        access_control &&
        create_ticket &&
        findAccessType(access_type, 'QR Code') &&
        findAccessType(access_type, 'Dynamic QR Code') &&
        findAccessType(access_type, 'Door Management')
      ) {
        showQrCode1.value = true;
        showQrCode2.value = true;
        showQrCode3.value = false;
        showQrCode4.value = true;
        showQrCode5.value = true;
      }
      // 11
      if (
        access_control &&
        !create_ticket &&
        findAccessType(access_type, 'QR Code') &&
        !findAccessType(access_type, 'Dynamic QR Code') &&
        findAccessType(access_type, 'Door Management')
      ) {
        showQrCode1.value = false;
        showQrCode2.value = false;
        showQrCode3.value = true;
        showQrCode4.value = false;
        showQrCode5.value = true;
      }
      // 12
      if (
        access_control &&
        !create_ticket &&
        findAccessType(access_type, 'QR Code') &&
        findAccessType(access_type, 'Dynamic QR Code') &&
        findAccessType(access_type, 'Door Management')
      ) {
        showQrCode1.value = false;
        showQrCode2.value = false;
        showQrCode3.value = true;
        showQrCode4.value = true;
        showQrCode5.value = true;
      }

      console.log(showQrCode1.value, showQrCode2.value, showQrCode3.value, showQrCode4.value, showQrCode5.value);

      if (record.doc.status === 'Pending Payment' && record.doc.docstatus === 1) {
        if (record.doc.reservation_expiry) {
          // 检查expiry是否距离当前时间超过5分钟
          if (dayjs().diff(record.doc.reservation_expiry, 'minute') > 5) {
            showPayment.value = false;
          } else {
            showPayment.value = true;
          }
        } else {
          showPayment.value = true;
        }
      } else {
        showPayment.value = false;
      }

      // 当需要付款时订阅更新状态
      if (showPayment.value && record.pos_invoice) {
        mqtt.useSubscribe(record.pos_invoice, {
          pageCtx: ctx,
          callback: () => {
            setTimeout(() => {
              getData();
            }, 3000);
          },
        });
      }

      // check need to notify page refresh
      if (record) {
        if (latestStatus !== null && latestStatus !== record.doc.status) {
          notifyPageSeed();
        }

        latestStatus = record.doc.status;
      }

      isLoading = false;
    } catch (err) {
      isLoading = false;
      console.error(err);
    }

    $update();

    if (lockScroll) {
      return;
    } else {
      lockScroll = true;
      setTimeout(() => {
        // scroll to top
        $('.page-content').scrollTop(0);
        setTimeout(() => {
          lockScroll = false;
        }, 2000);
      }, 0);
    }
  }

  // 查找 access_type
  function findAccessType(access_type_list, access_type) {
    return access_type_list.find((item) => item.access_type === access_type);
  }

  function getQRCode(qrcode, encode) {
    const v = encode ? `55AA{{${btoa(qrcode)}}}99BB` : qrcode;
    return erp.get_url(`/sqr?d=${v}`);
  }

  function showQRCodeSheet(ticket) {
    cordova.plugins.qrcodejs.encode(
      'TEXT_TYPE',
      ticket.qr_code,
      (base64EncodedQRImage) => {
        $('#ticket_qr_code').attr('src', base64EncodedQRImage);
        $('#guest-name').html(ticket.guest_name);
        $('#counter').html(ticket.valid_to);

        app.sheet.open('.facilit-ticket-sheet-swipe-to-close');
      },
      (err) => {},
      {
        correctLevel: 0,
      }
    );
  }

  // const PAYMETHOD_MAP = {
  //   'WeChat': 42,
  //   'Alipay': 5,
  //   'Alipay-HKD': 35,
  //   'Credit Card': 37,
  //   'Bank Transfer': 13,
  //   'Octopus': 19,
  // };

  let paymentRequestLock = false;
  async function requestPaymentGatewayURL() {
    if (paymentRequestLock) return;
    paymentRequestLock = true;
    try {
      if (record.doc.mode_of_payment === 'Cheque') {
        if (record.doc.price > 0) {
          app.dialog.alert(_('Please Make The Payment At The Resident Service Center.'));
        }
        return;
      }
      if (record.doc.status === 'Confirmed' || record.doc.status === 'Paid' || !showPayment.value) {
        return;
      }

      if (record.mode_of_payment.show_payment_code !== 1) {
        let cookie =
          http2
            .getCookieString()
            .split(';')
            .filter((item) => item.trim().startsWith('sid='))[0] || '';
        cookie = cookie.trim();
        console.log('cookie', cookie);

        const response = await http2.request({
          url: encodeURI(
            '/api/method/mpay_payment_integration.mpay_payment_integration.doctype.mpay_payment_gateway.get_mpay_payment_url'
          ),
          method: 'GET',
          debug: true,
          params: {
            // reference_doctype: 'POS Invoice',
            // reference_docname: record.pos_invoice,
            pos_invoice_docname: record.pos_invoice,
            // price_fieldname: 'total',
            // payer_name: users[users.current].usr,
            // currency: record.doc.currency,
            paymethod: record.mode_of_payment.custom_payment_gateway_code || 0,
            // locale: 'en_US',
            customizeddata: cookie,
          },
        });

        payment_gateway_url = response.data.message;
        console.log(' ', payment_gateway_url);
        $update();

        // iOS 并且微信支付
        if (Capacitor.getPlatform() === 'ios' && record.mode_of_payment.custom_payment_gateway_code == 42) {
          window.open(payment_gateway_url, '_blank');
        } else {
          // webview 新开窗口
          Capacitor.Plugins.InAppBrowser.openWebView({
            url: payment_gateway_url,
            toolbarType: 'navigation',
            title: _(record.pos_invoice),
          });
        }

        // window.open(payment_gateway_url, '_blank');
      }
    } catch (error) {
      console.error('requestPaymentGatewayURL', error);
      app.toast.show({
        text: _(error),
        position: 'bottom',
        closeTimeout: 2000,
      });
    } finally {
      paymentRequestLock = false;
    }
  }

  async function confirmBooking() {
    try {
      app.preloader.show();
      await http2.request({
        url: encodeURI('/api/resource/Facility Booking/' + docname),
        method: 'PUT',
        responseType: 'json',
        serializer: 'json',
        data: {
          docstatus: 1,
        },
      });

      await getData();
      requestPaymentGatewayURL();

      app.preloader.hide();
    } catch (error) {
      app.preloader.hide();

      app.toast.show({
        text: _(error),
        position: 'bottom',
        closeTimeout: 2000,
      });
    }
  }

  async function refresh(e, done) {
    try {
      await getData();
    } catch (err) {
      // ignore
    } finally {
      done();
    }
  }

  function notifyPageSeed() {
    window.pageRefresher.goup('Facility Booking');
  }

  function addToCalendar(booking) {
    console.log(booking);

    const location = booking.facility_flat;
    const title = booking.facility_type;
    const startDate = dayjs(booking.from_time).toDate();
    const endDate = dayjs(booking.to_time).toDate();

    window.plugins.calendar.createEventInteractively(
      title,
      location,
      '',
      startDate,
      endDate,
      () => {
        // success
      },
      (err) => {
        console.log(err);
      }
    );
  }

  $onMounted(() => {
    getData();
    emitter.on('cap:app:resume', getData);

    try {
      browserListener = Capacitor.Plugins.InAppBrowser.addListener('closeEvent', () => {
        getData();
      });

      browserPageLoadedListener = Capacitor.Plugins.InAppBrowser.addListener('browserPageLoaded', () => {
        Capacitor.Plugins.InAppBrowser.executeScript({
          code: `
          // hook window.confirm
          window.confirm = function() { return true; };
          `,
        });
      });
    } catch (error) {
      // ignore
    }
  });

  $onUnmounted(() => {
    try {
      if (browserListener) {
        browserListener.remove();
      }
    } catch (error) {
      // ignore
    }

    try {
      if (browserPageLoadedListener) {
        browserPageLoadedListener.remove();
      }
    } catch (error) {
      // ignore
    }

    emitter.off('cap:app:resume', getData);
  });

  return $render;
};
</script>
