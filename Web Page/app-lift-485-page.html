<template>
  <div class="page">
    <div class="navbar active">
      <div class="navbar-bg"></div>
      <div class="navbar-inner sliding">
        <div class="left">
          <a href="#" class="button button-fill text-color-theme bg-color-white button-44 back">
            <i class="icon icon-back"></i>
            <span class="if-not-md">Back</span>
          </a>
        </div>
        <div class="title">{{ _('Lift485 Pannel') }}</div>
      </div>
    </div>

    <div class="page-content">
      {% raw %}
      <div id="vue-app" v-cloak>
        <div class="main-box">
          <div class="top-status">
            <div
              class="top-item"
              :class="{ danger: !wifiConnected, connected: wifiConnected }"
              :aria-label="wifiConnected ? _('WiFi connected') : _('WiFi disconnected')"
            >
              <i class="icon f7-icons">{{ wifiConnected ? 'wifi' : 'wifi_slash' }}</i>
            </div>
            <div
              class="top-item"
              :class="{ muted: !btConnected, 'bt-connected': btConnected }"
              v-on:click="toggleBt"
              :aria-label="btConnected ? _('Bluetooth connected') : _('Bluetooth disconnected')"
            >
              <i class="material-icons">{{ btConnected ? 'bluetooth' : 'bluetooth_disabled' }}</i>
            </div>
          </div>
          <div class="block">
            <div class="row">
              <div class="col-33 lift-485-item lift-cell" v-for="item in buttonGroupList" :key="item.device_command">
                <div class="lift-btn" :class="{ 'active': liftStates[item.device_command] }" v-on:click="onLiftToggle(item)">
                  <div class="lift-btn-inner">{{ _(item.button_name) }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      {% endraw %}
    </div>
  </div>
</template>

<script>
  export default async (props, ctx) => {
    const $f7 = ctx.$f7,
      $f7route = ctx.$f7route,
      $onUnmounted = ctx.$onUnmounted,
      $on = ctx.$on;

    let vueApp = null;
    const { guid, subdevice } = $f7route.query;
    $on('pageMounted', (e, page) => {
      vueApp = new Vue({
        el: page.el.querySelector('#vue-app'),
        data: {
          btConnected: false,
          wifiConnected: false,
          liftStates: {},
          cooldowns: {}, // 新增冷却状态追踪
          buttonGroupList: [
            {
              button_name: 'G',
              device_command: 'BLE_LIFT485_RELAY_0',
              device_command_list: ['01050000FF008C3A', '010500000000CDCA'],
            },
            {
              button_name: '1',
              device_command: 'BLE_LIFT485_RELAY_1',
              device_command_list: ['01050001FF00DDFA', '0105000100009C0A'],
            },
            {
              button_name: '2',
              device_command: 'BLE_LIFT485_RELAY_2',
              device_command_list: ['01050002FF002DFA', '0105000200006C0A'],
            },
            {
              button_name: '3',
              device_command: 'BLE_LIFT485_RELAY_3',
              device_command_list: ['01050003FF007C3A', '0105000300003DCA'],
            },
            {
              button_name: '5',
              device_command: 'BLE_LIFT485_RELAY_5',
              device_command_list: ['01050005FF009C3B', '010500050000DDCB'],
            },
            {
              button_name: '6',
              device_command: 'BLE_LIFT485_RELAY_6',
              device_command_list: ['01050006FF006C3B', '0105000600002DCB'],
            },
            {
              button_name: '7',
              device_command: 'BLE_LIFT485_RELAY_7',
              device_command_list: ['01050007FF003DFB', '0105000700007C0B'],
            },
            {
              button_name: '8',
              device_command: 'BLE_LIFT485_RELAY_8',
              device_command_list: ['01050008FF000DF8', '0105000800004C08'],
            },
            {
              button_name: '9',
              device_command: 'BLE_LIFT485_RELAY_9',
              device_command_list: ['01050009FF005C38', '0105000900001DC8'],
            },
            {
              button_name: '10',
              device_command: 'BLE_LIFT485_RELAY_10',
              device_command_list: ['0105000AFF00AC38', '0105000A0000EDC8'],
            },
            {
              button_name: '11',
              device_command: 'BLE_LIFT485_RELAY_11',
              device_command_list: ['0105000BFF00FDF8', '0105000B0000BC08'],
            },
            {
              button_name: '12',
              device_command: 'BLE_LIFT485_RELAY_12',
              device_command_list: ['0105000CFF004C39', '0105000C00000DC9'],
            },
            {
              button_name: '15',
              device_command: 'BLE_LIFT485_RELAY_15',
              device_command_list: ['0105000FFF00BC39', '0105000F0000FDC9'],
            },
            {
              button_name: '16',
              device_command: 'BLE_LIFT485_RELAY_16',
              device_command_list: ['01050010FF008DFF', '010500100000CC0F'],
            },
            {
              button_name: '17',
              device_command: 'BLE_LIFT485_RELAY_17',
              device_command_list: ['01050011FF00DC3F', '0105001100009DCF'],
            },
            {
              button_name: '18',
              device_command: 'BLE_LIFT485_RELAY_18',
              device_command_list: ['01050012FF002C3F', '0105001200006DCF'],
            },
            {
              button_name: '19',
              device_command: 'BLE_LIFT485_RELAY_19',
              device_command_list: ['01050013FF007DFF', '0105001300003C0F'],
            },
            {
              button_name: '20',
              device_command: 'BLE_LIFT485_RELAY_20',
              device_command_list: ['01050014FF00CC3E', '0105001400008DCE'],
            },
            {
              button_name: '21',
              device_command: 'BLE_LIFT485_RELAY_21',
              device_command_list: ['01050015FF009DFE', '010500150000DC0E'],
            },
            {
              button_name: '22',
              device_command: 'BLE_LIFT485_RELAY_22',
              device_command_list: ['01050016FF006DFE', '0105001600002C0E'],
            },
            {
              button_name: '23',
              device_command: 'BLE_LIFT485_RELAY_23',
              device_command_list: ['01050017FF003C3E', '0105001700007DCE'],
            },
            {
              button_name: '25',
              device_command: 'BLE_LIFT485_RELAY_25',
              device_command_list: ['01050019FF005DFD', '0105001900001C0D'],
            },
            {
              button_name: '26',
              device_command: 'BLE_LIFT485_RELAY_26',
              device_command_list: ['0105001AFF00ADFD', '0105001A0000EC0D'],
            },
            {
              button_name: '28',
              device_command: 'BLE_LIFT485_RELAY_28',
              device_command_list: ['0105001CFF004DFC', '0105001C00000C0C'],
            },
            {
              button_name: 'R',
              device_command: 'BLE_LIFT485_RELAY_29',
              device_command_list: ['0105001DFF001C3C', '0105001D00005DCC'],
            },
            {
              button_name: 'Master',
              device_command: 'BLE_LIFT485_RELAY_30',
              device_command_list: ['0105001EFF00EC3C', '0105001E0000ADCC'],
            },
          ],
        },
        computed: {},
        watch: {},
        mounted() {
          this.init();
        },
        methods: {
          init(){
            //判断蓝牙连接状态
            if(window.peripheral[guid]){
              this.btConnected = window.peripheral[guid].prop.connected;
            }
            //判断wifi状态
            this.checkWifi();
          },
          cleanupWifiListener() {
            if (this._wifiTopic && this._wifiChangeHandler) {
              emitter.off(this._wifiTopic, this._wifiChangeHandler);
            }
            this._wifiTopic = null;
            this._wifiChangeHandler = null;
          },
          checkWifi(){
            // 清理上一次订阅，避免重复注册与内存泄漏
            this.cleanupWifiListener();

            // find the gateway
            const profileDevice = (erp?.info?.profile?.profile_device && cloneDeep(erp.info.profile.profile_device)) || [];
            const profileDeviceMap = profileDevice.find(item => item.device === guid);
            if(!profileDeviceMap){
              this.wifiConnected = false;
              return;
            }
            const gateway = profileDeviceMap.gateway;
            if(!gateway){
              this.wifiConnected = false;
              return;
            }

            const will_topic = `will/${md5(md5(gateway))}`;
            try {
              core_mqtt_subscribe(will_topic, 1, false);
            } catch (e) {
              console.warn('core_mqtt_subscribe failed', e);
            }

            this._wifiTopic = will_topic;
            // 构造监听函数
            this._wifiChangeHandler = (data = {}) => {
              if (typeof data.message === 'string' && data.message.includes("Online")) {
                this.wifiConnected = true;
              } else if (typeof data.message === 'string' && data.message.includes("Offline")) {
                this.wifiConnected = false;
              }
            };
            emitter.on(this._wifiTopic, this._wifiChangeHandler);
          },
          async sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          },
          toggleBt() {
            this.btConnected = !this.btConnected;
          },
          async onLiftToggle(item) {
            const device_command = item.device_command;
            
            // 1. 检查是否在5秒冷却时间内
            if (this.cooldowns[device_command]) {
              console.log('Button is in cooldown:', item.button_name);
              return;
            }

            // 2. 震动反馈
            try {
              const vib = window.navigator.vibrate || window.navigator.webkitVibrate || window.navigator.mozVibrate || window.navigator.msVibrate;
              if (vib) {
                vib.call(window.navigator, 50);
              }
            } catch (e) {}

            // 3. 立即亮灯并设置锁定状态
            this.$set(this.liftStates, device_command, true);
            this.$set(this.cooldowns, device_command, true);
            this.$forceUpdate();

            // 始终发送第一个指令（ON 指令）
            const command = item && item.device_command_list;
            
            if (!command) {
              console.error('Command missing');
              this.$set(this.liftStates, device_command, false);
              this.$set(this.cooldowns, device_command, false);
              return;
            }
            
            try {
              await window.peripheral[guid].doHdmiCec([{
                gang: 1,
                command: `8602${command[0].toLocaleLowerCase()}`,
              }]);
              setTimeout(() => {
                window.peripheral[guid].doHdmiCec([{
                  gang: 1,
                  command: `8602${command[1].toLocaleLowerCase()}`,
                }]);
              }, 1500);
              // await window.peripheral[guid].write([
              //   {
              //     service: 'ff80',
              //     characteristic: 'ff81',
              //     data: command,
              //   },
              // ]);
              
              let control_source = await bleHelper.getControlSource(guid);
              window.upload_device_control_log(guid, 1, control_source, subdevice, {
                command_type: 'ON',
                device_type: 'LIFT485',
                command: JSON.stringify(command),
                device_command: item.device_command,
                button_name: item.button_name,
              });

              // 4. 开启5秒计时器：仅解除锁定，灯光保持开启（直到离开页面）
              setTimeout(() => {
                this.$set(this.cooldowns, device_command, false);
                this.$forceUpdate();
                console.log('Button cooldown finished, light stays on:', item.button_name);
              }, 5000);

            } catch (error) {
              console.error('Command send failed:', error);
              // 发送失败立即重置状态，允许重试
              this.$set(this.liftStates, device_command, false);
              this.$set(this.cooldowns, device_command, false);
              
              if (error == 7200) {
                erp.script.iot_entry_class_password_verify(props.kitem.device, props.kitem.name).then(() => {});
              } else {
                app.dialog.alert(_(erp.get_log_description(error)));
              }
            }
          },
        },
      });
    });

    $on('pageBeforeRemove', (e, page) => {
      if (vueApp && vueApp.cleanupWifiListener) {
        vueApp.cleanupWifiListener();
      }
    });

    $onUnmounted(() => {
      if (vueApp && vueApp.cleanupWifiListener) {
        vueApp.cleanupWifiListener();
      }
      if (vueApp) {
        vueApp.$destroy();
      }
    });

    return $render;
  };
</script>
