<script>
  export default async (props, ctx) => {
    const $f7 = ctx.$f7,
      $ref = ctx.$ref,
      $f7route = ctx.$f7route,
      $update = ctx.$update,
      $on = ctx.$on,
      $onBeforeMount = ctx.$onBeforeMount,
      $onMounted = ctx.$onMounted,
      $onBeforeUpdate = ctx.$onBeforeUpdate,
      $onUpdated = ctx.$onUpdated,
      $onBeforeUnmount = ctx.$onBeforeUnmount,
      $onUnmounted = ctx.$onUnmounted;

    const docname = $f7route.query.docname;
    const showPayment = $ref(false);

    let booking_data = null;
    let isInit = false;
    let browserListener = null;
    let browserPageLoadedListener = null;
    let latestStatus = null;
    let payment_gateway_url = null;

    const isKtmarina = (() => {
      try {
        return erp.appId === 'com.yoswit.ktmarina';
      } catch (e) {
        return false;
      }
    })();

    async function getData() {
      try {
        isInit = true;
        const response = await http2.request({
          url: encodeURI('/api/method/appv6.query_record'),
          method: 'GET',
          params: {
            docname: docname,
          },
        });
        booking_data = response.data;
        booking_data.subscription = booking_data.doc;

        updatePaymentVisibility();
        subscribePaymentStatus();
        notifyStatusChanged();

        $update();
      } catch (err) {
        console.error(err);
      }
    }

    function getQRCode(qrcode, encode) {
      const v = encode ? `55AA{{${btoa(qrcode)}}}99BB` : qrcode;
      return erp.get_url(`/sqr?d=${v}`);
    }

    function updatePaymentVisibility() {
      const subscription = booking_data && booking_data.subscription;
      if (!subscription || subscription.status !== 'Pending Payment' || subscription.docstatus !== 1) {
        showPayment.value = false;
        return;
      }

      if (subscription.reservation_expiry) {
        showPayment.value = dayjs().diff(subscription.reservation_expiry, 'minute') <= 5;
        return;
      }

      showPayment.value = true;
    }

    function subscribePaymentStatus() {
      if (!showPayment.value || !booking_data || !booking_data.pos_invoice || typeof mqtt === 'undefined') {
        return;
      }

      mqtt.useSubscribe(booking_data.pos_invoice, {
        pageCtx: ctx,
        callback: () => {
          setTimeout(() => {
            getData();
          }, 3000);
        },
      });
    }

    function notifyStatusChanged() {
      const subscription = booking_data && booking_data.subscription;
      if (!subscription) {
        return;
      }

      if (latestStatus !== null && latestStatus !== subscription.status) {
        notifyPageSeed();
      }

      latestStatus = subscription.status;
    }

    function notifyPageSeed() {
      try {
        window.pageRefresher.goup('Facility Booking Subscription');
      } catch (error) {
        // ignore
      }
    }

    let paymentRequestLock = false;
    async function requestPaymentGatewayURL() {
      if (paymentRequestLock) return;
      paymentRequestLock = true;
      try {
        if (!booking_data || !booking_data.subscription) {
          return;
        }

        const subscription = booking_data.subscription;
        const modeOfPayment = booking_data.mode_of_payment;

        if (subscription.mode_of_payment === 'Cheque') {
          if (subscription.price > 0) {
            app.dialog.alert(_('Please Make The Payment At The Resident Service Center.'));
          }
          return;
        }

        if (subscription.status === 'Confirmed' || subscription.status === 'Paid' || !showPayment.value) {
          return;
        }

        if (!booking_data.pos_invoice || !modeOfPayment || modeOfPayment.show_payment_code === 1) {
          return;
        }

        let cookie =
          http2
            .getCookieString()
            .split(';')
            .filter((item) => item.trim().startsWith('sid='))[0] || '';
        cookie = cookie.trim();

        const response = await http2.request({
          url: encodeURI(
            '/api/method/mpay_payment_integration.mpay_payment_integration.doctype.mpay_payment_gateway.get_mpay_payment_url'
          ),
          method: 'GET',
          debug: true,
          params: {
            pos_invoice_docname: booking_data.pos_invoice,
            paymethod: modeOfPayment.custom_payment_gateway_code || 0,
            customizeddata: cookie,
          },
        });

        payment_gateway_url = response.data.message;
        $update();

        if (Capacitor.getPlatform() === 'ios' && modeOfPayment.custom_payment_gateway_code == 42) {
          window.open(payment_gateway_url, '_blank');
        } else {
          Capacitor.Plugins.InAppBrowser.openWebView({
            url: payment_gateway_url,
            toolbarType: 'navigation',
            title: _(booking_data.pos_invoice),
          });
        }
      } catch (error) {
        console.error('requestPaymentGatewayURL', error);
        app.toast.show({
          text: _(error),
          position: 'bottom',
          closeTimeout: 2000,
        });
      } finally {
        paymentRequestLock = false;
      }
    }

    async function confirmBooking() {
      try {
        app.preloader.show();
        await http2.request({
          url: encodeURI('/api/resource/Facility Booking Subscription/' + docname),
          method: 'PUT',
          data: {
            docstatus: 1,
          },
        });

        await getData();
        requestPaymentGatewayURL(); 
        app.preloader.hide();
      } catch (error) {
        app.preloader.hide();

        app.toast.show({
          text: _(error),
          position: 'bottom',
          closeTimeout: 2000,
        });
      }
    }

    async function clickPickup() {
      try {
        app.preloader.show();
        await http2.request({
          url: encodeURI('/api/resource/Facility Booking Subscription/' + docname),
          method: 'PUT',
          data: {
            status: 'In Use',
          },
        });

        await getData();
        app.preloader.hide();
      } catch (error) {
        app.preloader.hide();

        app.toast.show({
          text: _(error),
          position: 'bottom',
          closeTimeout: 2000,
        });
      }
    }

    async function refresh(e, done) {
      try {
        await getData();
        done();
      } catch (err) {
        // ignore
        done();
      }
    }

    $onMounted(() => {
      getData();
      emitter.on('cap:app:resume', getData);

      try {
        browserListener = Capacitor.Plugins.InAppBrowser.addListener('closeEvent', () => {
          getData();
        });

        browserPageLoadedListener = Capacitor.Plugins.InAppBrowser.addListener('browserPageLoaded', () => {
          Capacitor.Plugins.InAppBrowser.executeScript({
            code: `
            window.confirm = function() { return true; };
            `,
          });
        });
      } catch (error) {
        // ignore
      }
    });

    $onUnmounted(() => {
      try {
        if (browserListener) {
          browserListener.remove();
        }
      } catch (error) {
        // ignore
      }

      try {
        if (browserPageLoadedListener) {
          browserPageLoadedListener.remove();
        }
      } catch (error) {
        // ignore
      }

      emitter.off('cap:app:resume', getData);
    });

    return $render;
  };
</script>
